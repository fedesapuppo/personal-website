<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found - Federico Sapuppo</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        .notfound {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            gap: 1rem;
        }
        .notfound-code {
            font-size: clamp(4rem, 14vw, 7rem);
            font-weight: 700;
            line-height: 1;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .notfound h1 {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            color: var(--secondary-color);
        }
        .notfound p {
            color: var(--text-light);
            max-width: 34rem;
        }
        .notfound-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem 1.5rem;
            margin-top: 1rem;
        }
        .notfound-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .notfound-links a:hover,
        .notfound-links a:focus-visible {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="notfound">
        <p class="notfound-code" aria-hidden="true">404</p>
        <h1>This page doesn't exist</h1>
        <p>The link may be outdated, or the page moved. Here is where everything lives now.</p>
        <nav class="notfound-links" aria-label="Site sections">
            <a href="/">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/hermes/">Hermes</a>
            <a href="/argpt/">ARGPT</a>
            <a href="/contrarian-trifecta/">Contrarian Trifecta</a>
            <a href="/propiedades/">Propiedades</a>
        </nav>
    </main>
</body>
</html>
