name: Deploy to fedesapuppo.github.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to fedesapuppo.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: fedesapuppo/fedesapuppo.github.io
          publish_branch: main
          publish_dir: .
          exclude_assets: '.github,CLAUDE.md,.claude,.cursor,README.md'
          cname: fedesapuppo.com
