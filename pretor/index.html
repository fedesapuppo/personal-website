<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretor moved to pretor.ar</title>

    <link rel="canonical" href="https://pretor.ar/">
    <meta http-equiv="refresh" content="0; url=https://pretor.ar/">

    <link rel="icon" type="image/svg+xml" href="/pretor-icon.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        .moved {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
            gap: 1rem;
        }
        .moved h1 {
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            color: var(--secondary-color);
        }
        .moved p {
            color: var(--text-light);
            max-width: 34rem;
        }
        .moved a {
            color: var(--primary-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="moved">
        <h1>Pretor now lives at pretor.ar</h1>
        <p>You should be redirected in a moment. If not,
            <a href="https://pretor.ar/">continue to pretor.ar</a>.</p>
    </main>
</body>
</html>
